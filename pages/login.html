<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Ace Manager</title>
  <link rel="icon" type="image/svg+xml" href="../assets/ace-mark.svg" />
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="../css/styles.css?v=20260811190143" />
</head>
<body>
  <header class="ace-header">
    <div class="ace-header-inner">
      <div class="ace-brand-lockup">
        <img src="../assets/ace-mark.svg" alt="" class="ace-header-logo" />
        <h1 class="ace-logo">Ace Manager</h1>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-logo-wrap">
      <img src="../assets/ace-lockup.png" alt="Ace Manager" class="auth-page-lockup" />
    </div>
    <div class="auth-card">
      <h2>Log In</h2>
      <form id="loginForm">
        <label>Email
          <input type="email" id="email" required autocomplete="email" />
        </label>
        <label>Password
          <input type="password" id="password" required autocomplete="current-password" />
        </label>
        <div id="errorMsg" class="error-msg" style="display:none;" role="alert"></div>
        <button type="submit" class="btn-primary" id="loginBtn">Log In</button>
      </form>
      <div class="auth-links">
        <a href="reset-password.html">Forgot password?</a>
        <span>·</span>
        <a href="signup.html">Create account</a>
      </div>
    </div>
  </main>

  <footer class="ace-footer">
    Product of Consult Granato Education LLC
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js?v=20260811190143"></script>
  <script src="../js/utils.js?v=20260811190143"></script>
  <script src="../js/auth.js?v=20260811190143"></script>
  <script src="../js/router.js?v=20260811190143"></script>
  <script src="../js/app.js?v=20260811190143"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');

      // Supabase's raw strings ("Invalid login credentials") read like a bug
      // report; say what to do instead.
      const friendly = (message) => {
        const m = (message || '').toLowerCase();
        if (m.includes('invalid login credentials')) {
          return 'That email and password don’t match an account. Check for typos, or use “Forgot password?” below.';
        }
        if (m.includes('email not confirmed')) {
          // Accounts are auto-confirmed, so no confirmation email exists to go
          // looking for. If this ever fires, it means the setting changed —
          // point at a person rather than at an empty inbox.
          return 'This account isn’t active yet. Contact your Ace Manager administrator.';
        }
        if (m.includes('failed to fetch') || m.includes('network')) {
          return 'Couldn’t reach the server. Check your connection and try again.';
        }
        return message || 'Could not sign in. Please try again.';
      };

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorMsg.style.display = 'none';
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.textContent = 'Signing in…';

        const { data, error } = await window.aceAuth.signIn(email, password);
        if (error) {
          btn.disabled = false;
          btn.textContent = 'Log In';
          errorMsg.textContent = friendly(error.message);
          errorMsg.style.display = 'block';
        } else {
          window.aceRouter.toHome();
        }
      });
    });
  </script>
</body>
</html>
